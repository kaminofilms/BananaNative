name: Banana official-behavior baseline APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oot-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Fetch upstream source and matching preparation runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 -o upstream.zip https://git.eden-emu.dev/moceure/BananaNative/archive/v0.2.4.zip
          curl --fail --location --retry 3 --max-time 180 -o official.apk https://git.eden-emu.dev/moceure/BananaNative/releases/download/v0.2.4/banana-native-v0.2.4.apk
          echo "972ad854455727531ef70440179954e26054ee253555b6c05dfd7c3c7b9f38b5  official.apk" | sha256sum --check
          sha256sum upstream.zip official.apk > input-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('upstream.zip') as z:
              z.extractall('source')
          roots = list(Path('source').glob('*/android/app/build.gradle'))
          assert len(roots) == 1, roots
          root = roots[0].parents[2]
          root.rename('upstream')
          stage = Path('pack-stage')
          (stage/'lib').mkdir(parents=True)
          with zipfile.ZipFile('official.apk') as z:
              for name in ['libpython3.14.so','libnxpack.so','libzbicdec.so','libdmsh_xlate.so','libSPIRV-Tools-shared.so']:
                  (stage/'lib'/name).write_bytes(z.read('lib/arm64-v8a/'+name))
              from io import BytesIO
              with zipfile.ZipFile(BytesIO(z.read('assets/pack/python.zip'))) as py:
                  py.extractall(stage/'python')
          assert (stage/'python/lib/python3.14/os.py').is_file()
          PY
      - name: Match official play behavior with a separate package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/android/app/build.gradle')
          s = p.read_text()
          old = "'dev.nxnative.android.play'"
          # Change only the play variant's application ID, not its runtime behavior.
          assert s.count("applicationId nxLive ? 'dev.bananative.android' : nxPlay ? " + old) == 1
          s = s.replace("applicationId nxLive ? 'dev.bananative.android' : nxPlay ? " + old,
                        "applicationId nxLive ? 'dev.bananative.android' : nxPlay ? 'dev.nxnative.android.ootdebug'")
          p.write_text(s)
          PY
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > upstream/android/app/local.properties
          chmod +x upstream/android/app/gradlew
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: banana-oot-signing-v1
      - name: Build official-behavior baseline APK
        working-directory: upstream/android/app
        run: ./gradlew --no-daemon -PnxPlay=true -PnxVersion=0.2.4 -PnxPackStage="$GITHUB_WORKSPACE/pack-stage" apk
      - name: Package build sources and notices
        if: success()
        shell: bash
        run: |
          mkdir -p deliverables
          cp input-sha256.txt deliverables/ 2>/dev/null || true
          find upstream/android/app/out -maxdepth 1 -name '*.apk' -exec cp {} deliverables/ \; 2>/dev/null || true
          tar --exclude=upstream/android/app/.gradle --exclude=upstream/android/app/build --exclude=upstream/android/app/.cxx --exclude=upstream/android/app/out --exclude=upstream/android/app/local.properties -czf deliverables/build-source.tar.gz upstream
          cp README.md deliverables/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: banana-oot-baseline
          path: deliverables/
          retention-days: 14
          if-no-files-found: error

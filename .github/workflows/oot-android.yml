name: OOT foliage depth candidate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oot-android.yml', 'patches/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Fetch upstream source and matching preparation runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 -o upstream.zip https://git.eden-emu.dev/moceure/BananaNative/archive/v0.2.4.zip
          curl --fail --location --retry 3 --max-time 180 -o official.apk https://git.eden-emu.dev/moceure/BananaNative/releases/download/v0.2.4/banana-native-v0.2.4.apk
          echo "972ad854455727531ef70440179954e26054ee253555b6c05dfd7c3c7b9f38b5  official.apk" | sha256sum --check
          echo "644494f4ea60553bd561869937ca0f758058bb91b8a19f7ddd276414ccd779fc  upstream.zip" | sha256sum --check
          sha256sum upstream.zip official.apk > input-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('upstream.zip') as z:
              z.extractall('source')
          roots = list(Path('source').glob('*/android/app/build.gradle'))
          assert len(roots) == 1, roots
          root = roots[0].parents[2]
          root.rename('upstream')
          stage = Path('pack-stage')
          (stage/'lib').mkdir(parents=True)
          with zipfile.ZipFile('official.apk') as z:
              for name in ['libpython3.14.so','libnxpack.so','libzbicdec.so','libdmsh_xlate.so','libSPIRV-Tools-shared.so']:
                  (stage/'lib'/name).write_bytes(z.read('lib/arm64-v8a/'+name))
              from io import BytesIO
              with zipfile.ZipFile(BytesIO(z.read('assets/pack/python.zip'))) as py:
                  py.extractall(stage/'python')
          assert (stage/'python/lib/python3.14/os.py').is_file()
          PY
      - name: Apply foliage depth correction and check depth states
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git apply --check ../patches/oot-mesh-depth.patch
          git apply ../patches/oot-mesh-depth.patch
          git apply --check ../patches/rtdump.patch
          git apply ../patches/rtdump.patch
          DM_GAME=0400486024DEC000 python3 -m unittest dm.tools.tests.test_vka_mesh_depth dm.tools.tests.test_vka_spec_freeze dm.tools.tests.test_vk_android_abi
      - name: Match official play behavior with a separate package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/android/app/build.gradle')
          s = p.read_text()
          old = "'dev.nxnative.android.play'"
          # Change only the play variant's application ID, not its runtime behavior.
          assert s.count("applicationId nxLive ? 'dev.bananative.android' : nxPlay ? " + old) == 1
          s = s.replace("applicationId nxLive ? 'dev.bananative.android' : nxPlay ? " + old,
                        "applicationId nxLive ? 'dev.bananative.android' : nxPlay ? 'dev.kaminofilms.bananative.ootfix'")
          old_label = "resValue 'string', 'app_name', nxPlay || nxLive ? 'Banana Native' : nxApp ? nxLabel : 'Banana Native test'"
          new_label = "resValue 'string', 'app_name', nxPlay ? 'Banana OOT Fix' : nxLive ? 'Banana Native' : nxApp ? nxLabel : 'Banana Native test'"
          assert s.count(old_label) == 1
          s = s.replace(old_label, new_label)
          p.write_text(s)
          PY
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > upstream/android/app/local.properties
          chmod +x upstream/android/app/gradlew
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/banana-signing
          key: banana-oot-signing-v2
      - name: Keep the custom signing key at the cached path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/banana-signing"
          key="$RUNNER_TEMP/banana-signing/oot-debug.keystore"
          if [ ! -f "$key" ]; then
            keytool -genkeypair -keystore "$key" -storepass android -keypass android -alias AndroidDebugKey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "NX_DEBUG_KEYSTORE=$key" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/android/app/build.gradle')
          s = p.read_text()
          old = '    signingConfigs {'
          assert s.count(old) == 1
          s = s.replace(old, old + "\n        debug { storeFile file(System.getenv('NX_DEBUG_KEYSTORE')) }")
          p.write_text(s)
          PY
      - name: Build foliage depth candidate APK
        working-directory: upstream/android/app
        run: ./gradlew --no-daemon -PnxPlay=true -PnxVersion=0.2.4-rtdump2 -PnxVersionCode=6 -PnxPackStage="$GITHUB_WORKSPACE/pack-stage" apk
      - name: Package build sources and notices
        if: success()
        shell: bash
        run: |
          mkdir -p deliverables
          cp input-sha256.txt deliverables/ 2>/dev/null || true
          test -f upstream/android/app/out/nxnative-android-play.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs upstream/android/app/out/nxnative-android-play.apk > deliverables/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging upstream/android/app/out/nxnative-android-play.apk > deliverables/apk-info.txt
          python3 - <<'PY'
          from pathlib import Path
          info = Path('deliverables/apk-info.txt').read_text()
          assert "package: name='dev.kaminofilms.bananative.ootfix'" in info, info[:500]
          assert "application-label:'Banana OOT Fix'" in info, info[:500]
          PY
          cp upstream/android/app/out/nxnative-android-play.apk deliverables/Banana-OOT-Fix.apk
          tar --exclude=upstream/android/app/.gradle --exclude=upstream/android/app/build --exclude=upstream/android/app/.cxx --exclude=upstream/android/app/out --exclude=upstream/android/app/local.properties -czf deliverables/build-source.tar.gz upstream
          cp README.md deliverables/
          cp patches/README.md deliverables/CANDIDATE-NOTES.md
          cp patches/oot-mesh-depth.patch patches/rtdump.patch deliverables/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: banana-oot-side-by-side
          path: deliverables/
          retention-days: 14
          if-no-files-found: error
